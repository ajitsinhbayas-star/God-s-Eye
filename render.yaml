services:
  - type: web
    name: gods-eye-space-observatory
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: NASA_API_KEY
        value: DEMO_KEY
      - key: CANONICAL_HOST
        value: https://orbitaleye.in
      - key: SENTINEL_ADMIN_USERNAME
        generateValue: true
      - key: SENTINEL_ADMIN_PASSWORD
        generateValue: true
      - key: SENTINEL_SESSION_SECRET
        generateValue: true
