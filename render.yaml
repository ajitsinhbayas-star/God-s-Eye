services:
  # Option A: Static Site Deployment on Render
  - type: static
    name: orbital-command-hud
    env: static
    buildCommand: "" # No build step needed for standalone HTML
    staticPublishPath: "."
    headers:
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Option B: Node.js Web Service (if serving dynamic proxies)
  # - type: web
  #   name: orbital-command-server
  #   env: node
  #   plan: free
  #   buildCommand: npm install
  #   startCommand: node server.js