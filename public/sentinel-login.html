<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel Admin Login // Space Situational Awareness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background-color: #020612;
      font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }
    .hud-box {
      background: radial-gradient(circle at center, rgba(3, 14, 8, 0.95) 0%, rgba(2, 6, 18, 0.98) 100%);
      border: 1px solid rgba(0, 255, 102, 0.45);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 25px rgba(0, 255, 102, 0.15);
    }
    .hud-glow {
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-200">
  <div class="hud-box max-w-md w-full p-6 sm:p-8 rounded-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-emerald-950/80 border border-emerald-500/50 text-emerald-400 text-3xl shadow-lg">
        🛡️
      </div>
      <h1 class="text-lg font-bold text-white tracking-widest uppercase hud-glow">SENTINEL OPERATIONS</h1>
      <p class="text-xs text-emerald-400 font-bold uppercase tracking-wider">Restricted Administrator Console</p>
      <p class="text-[11px] text-slate-400 font-sans">Enter authorized credentials to inspect background daemons and provider health.</p>
    </div>

    <!-- Error Alert Box -->
    <div id="login-error-alert" class="hidden p-3 rounded-xl bg-rose-950/70 border border-rose-500/60 text-rose-300 text-xs flex items-center gap-2">
      <span>⚠️</span>
      <span id="login-error-text">Invalid administrator credentials.</span>
    </div>

    <form id="admin-login-form" onsubmit="handleSentinelLogin(event)" class="space-y-4">
      <div>
        <label for="admin-username" class="block text-[11px] uppercase tracking-wider text-slate-400 font-bold mb-1">
          <i class="fa-solid fa-user-shield text-emerald-400 mr-1"></i> Admin Username
        </label>
        <input
          type="text"
          id="admin-username"
          required
          autocomplete="username"
          placeholder="e.g. Ajitsinh96"
          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-600 text-xs focus:outline-none focus:border-emerald-400 font-mono transition"
        />
      </div>

      <div>
        <label for="admin-password" class="block text-[11px] uppercase tracking-wider text-slate-400 font-bold mb-1">
          <i class="fa-solid fa-key text-emerald-400 mr-1"></i> Operations Password
        </label>
        <input
          type="password"
          id="admin-password"
          required
          autocomplete="current-password"
          placeholder="••••••••••••"
          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-600 text-xs focus:outline-none focus:border-emerald-400 font-mono transition"
        />
      </div>

      <button
        type="submit"
        id="btn-login-submit"
        class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2"
      >
        <span>Unlock Sentinel Bot Console ➔</span>
      </button>
    </form>

    <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-[10px] text-slate-500 font-mono">
      <a href="index.html" class="hover:text-cyan-400 transition">← Public 3D Explorer</a>
      <a href="orbitalert.html" class="hover:text-amber-400 transition">OrbitAlert Passes →</a>
    </div>
  </div>

  <script>
    async function handleSentinelLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error-alert');
      const errText = document.getElementById('login-error-text');
      const submitBtn = document.getElementById('btn-login-submit');
      const usernameInput = document.getElementById('admin-username');
      const passwordInput = document.getElementById('admin-password');

      const u = usernameInput.value.trim();
      const p = passwordInput.value;

      errBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Verifying Security Clearance...';

      // 1. If running over Express server, verify against /api/sentinel/login
      if (window.location.protocol !== 'file:') {
        try {
          const res = await fetch('/api/sentinel/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            submitBtn.innerText = 'Access Granted ✓ Redirecting...';
            localStorage.setItem('sentinel_admin_logged_in', 'true');
            sessionStorage.setItem('sentinel_admin_user', u);
            setTimeout(() => { window.location.href = data.redirect || 'sentinel.html'; }, 400);
            return;
          } else {
            showError(data.error || 'Access Denied: Invalid administrator credentials.');
            return;
          }
        } catch (_) {}
      }

      // 2. Client-side authentication fallback (for standalone file:// protocol)
      if (u === 'Ajitsinh96' && p === 'Ajitsinh@#9699') {
        submitBtn.innerText = 'Access Granted ✓ Redirecting...';
        localStorage.setItem('sentinel_admin_logged_in', 'true');
        sessionStorage.setItem('sentinel_admin_user', u);
        setTimeout(() => { window.location.href = 'sentinel.html'; }, 400);
      } else {
        showError('Access Denied: Invalid username or password.');
      }

      function showError(msg) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Unlock Sentinel Bot Console ➔';
        errText.innerText = msg;
        errBox.classList.remove('hidden');
        passwordInput.value = '';
        passwordInput.focus();
      }
    }
  </script>
  <script src="js/jarvis.js"></script>
</body>
</html>
