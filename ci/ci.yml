name: God's Eye CI & Release Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify System & Scientific Accuracy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Run Syntax & Static Checks
        run: npm run check

      - name: Audit Secret Leakage & .env Isolation
        run: npm run audit:secrets

      - name: Start God's Eye Server
        run: |
          node src/server.js &
          sleep 4

      - name: Run Full System & Regression Test Suite
        run: npm run test:system
        env:
          PORT: 3000
          SENTINEL_ADMIN_USERNAME: Ajitsinh96
          SENTINEL_ADMIN_PASSWORD: Ajitsinh@#9699
